# Name of the packaged application.
QPKG_NAME="FlyCast"
# Name of the display application.
QPKG_DISPLAY_NAME="FlyCast"
# Version of the packaged application.
QPKG_VER="0.1.0"
# Author or maintainer of the package
QPKG_AUTHOR="Kamil"
# License for the packaged application
QPKG_LICENSE="MIT"
# One-line description of the packaged application
QPKG_SUMMARY="FlyCast - lightweight video library with direct play + optional transcode."

# Preferred number in start/stop sequence.
QPKG_RC_NUM="109"
# Init-script used to control the start and stop of the installed application.
QPKG_SERVICE_PROGRAM="FlyCast.sh"

# Port number used by service program.
#QPKG_SERVICE_PORT=""
# Location of file with running service's PID
QPKG_SERVICE_PIDFILE="/share/CACHEDEV1_DATA/.qpkg/FlyCast/shared/flycast.pid"
# Relative path to web interface
QPKG_WEBUI="/"
# Port number for the web interface.
QPKG_WEB_PORT="8100"
# Port number for the SSL web interface.
#QPKG_WEB_SSL_PORT=""

# Minimum QTS version requirement
QTS_MINI_VERSION="5.0.0"
# Maximum QTS version requirement
#QTS_MAX_VERSION="5.1.0"

# Select volume
QPKG_VOLUME_SELECT="3"

# Set timeout for QPKG enable and QPKG disable (since 4.1.0)
QPKG_TIMEOUT="30,30"

# Visible setting for the QPKG that has web UI
#QPKG_VISIBLE="2"
